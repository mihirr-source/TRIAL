<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>🛡️ AI Shield</h1>
      <label class="switch" title="Enable/disable on all sites">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
    </header>

    <div class="status-row">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">Checking backend…</span>
    </div>

    <div class="stat-row">
      <span>Blurred on this tab</span>
      <strong id="count">—</strong>
    </div>

    <div class="threshold-row">
      <label for="threshold">Flag threshold</label>
      <input type="range" id="threshold" min="0.3" max="0.95" step="0.05" value="0.7" />
      <span id="threshold-value">0.70</span>
    </div>

    <p class="hint">
      Requires the local model server:
      <code>uvicorn main:app --port 8000</code>
    </p>

    <script src="popup.js"></script>
  </body>
</html>
